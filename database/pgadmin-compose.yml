services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aiops_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aiops.com
      PGADMIN_DEFAULT_PASSWORD: 
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "5050:80"
    networks:
      - aiops_network

networks:
  aiops_network:
    external: true
    name: aiops_network
